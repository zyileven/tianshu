# Tianshu (天枢) - Registry-based Docker Compose
# 基于镜像仓库部署（所有镜像从阿里云 ACR 等仓库拉取）
#
# 使用方式:
#   1. 复制 .env.example 为 .env 并配置（包括 REGISTRY_PREFIX）
#   2. 登录镜像仓库: docker login registry.cn-xxx.aliyuncs.com
#   3. 拉取并启动:
#      docker-compose -f docker-compose.registry.yml up -d
#   4. 查看日志: docker-compose -f docker-compose.registry.yml logs -f
#   5. 停止: docker-compose -f docker-compose.registry.yml down
#
# 前置要求:
#   - Docker 20.10+
#   - Docker Compose 2.0+
#   - NVIDIA GPU + NVIDIA Driver 525+ + NVIDIA Container Toolkit
#   - 已登录镜像仓库

# 项目名称
name: tianshu

services:
  # ============================================================================
  # Models Init (从模型镜像复制模型到共享卷，一次性任务)
  # ============================================================================
  models-init:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-models:${MODELS_TAG:-latest}
    container_name: tianshu-models-init
    restart: "no"
    volumes:
      - models-shared:/models-shared
    # 检查标记文件，避免重复复制
    command: >
      sh -c '
        if [ -f /models-shared/.models_copied ]; then
          echo "Models already copied, skipping.";
        else
          echo "Copying models to shared volume (~30GB, may take 5-10 minutes)...";
          cp -a /models-data/. /models-shared/ &&
          date -Iseconds > /models-shared/.models_copied &&
          echo "Models copy complete.";
        fi
      '

  # ============================================================================
  # Redis (高性能任务队列 - 可选)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: tianshu-redis
    restart: unless-stopped
    profiles:
      - redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tianshu-network

  # ============================================================================
  # RustFS Object Storage (S3 Compatible)
  # ============================================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: tianshu-rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - RUSTFS_ROOT_USER=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_SECRET_KEY:-rustfsadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tianshu-network

  # ============================================================================
  # Backend API Server
  # ============================================================================
  backend:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 模型共享卷（由 models-init 填充，替代原来的 ./models-offline 挂载）
      - models-shared:/models-external:ro
      # 容器内模型缓存
      - backend-models-cache:/root/.cache:rw
      - backend-paddleocr-cache:/root/.paddleocr:rw
      - ./models:/app/models:rw
      - ./models/paddlex_cache:/root/.paddlex:rw
      - ./models/huggingface_cache:/root/.cache/huggingface:rw
      - ./models/modelscope_cache:/root/.cache/modelscope:rw
      # 数据目录
      - ./data/uploads:/app/data/uploads:rw
      - ./data/output:/app/data/output:rw
      - ./logs/backend:/app/logs:rw
      - ./data/db:/app/data/db:rw
      # 时区
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - WORKER_URL=${WORKER_URL:-http://worker:8001}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-0}
      - MODEL_PATH=/app/models
      - OUTPUT_PATH=/app/data/output
      - UPLOAD_PATH=/app/data/uploads
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db/mineru_tianshu.db}
      - RUSTFS_ENABLED=${RUSTFS_ENABLED:-true}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-ts-img}
      - RUSTFS_SECURE=${RUSTFS_SECURE:-false}
      - RUSTFS_PUBLIC_URL=${RUSTFS_PUBLIC_URL}
      - MODEL_DOWNLOAD_SOURCE=${MODEL_DOWNLOAD_SOURCE:-local}
      - HF_OFFLINE=1
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_TOKEN=${HF_TOKEN:-}
      - REDIS_QUEUE_ENABLED=${REDIS_QUEUE_ENABLED:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tianshu-network
    depends_on:
      models-init:
        condition: service_completed_successfully
      worker:
        condition: service_started
      rustfs:
        condition: service_started

  # ============================================================================
  # LitServe Worker
  # ============================================================================
  worker:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-worker
    restart: unless-stopped
    command: ["worker", "python", "litserve_worker.py"]
    ports:
      - "${WORKER_PORT:-8001}:8001"
    volumes:
      # 模型共享卷
      - models-shared:/models-external:ro
      # 容器内模型缓存
      - worker-models-cache:/root/.cache:rw
      - worker-paddleocr-cache:/root/.paddleocr:rw
      - ./models:/app/models:rw
      - ./models/paddlex_cache:/root/.paddlex:rw
      - ./models/huggingface_cache:/root/.cache/huggingface:rw
      - ./models/modelscope_cache:/root/.cache/modelscope:rw
      # 数据目录
      - ./data/uploads:/app/data/uploads:rw
      - ./data/output:/app/data/output:rw
      - ./logs/worker:/app/logs:rw
      - ./data/db:/app/data/db:rw
      # 时区
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - WORKER_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_GPUS=${WORKER_GPUS:-2}
      - MODEL_PATH=/app/models
      - OUTPUT_PATH=/app/data/output
      - UPLOAD_PATH=/app/data/uploads
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db/mineru_tianshu.db}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-4}
      - TIMEOUT=${WORKER_TIMEOUT:-300}
      - MODEL_DOWNLOAD_SOURCE=local
      - HF_OFFLINE=1
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_TOKEN=${HF_TOKEN:-}
      - PDF_SPLIT_ENABLED=${PDF_SPLIT_ENABLED:-true}
      - PDF_SPLIT_THRESHOLD_PAGES=${PDF_SPLIT_THRESHOLD_PAGES:-500}
      - PDF_SPLIT_CHUNK_SIZE=${PDF_SPLIT_CHUNK_SIZE:-250}
      - PDF_SPLIT_SIZE_MB=${PDF_SPLIT_SIZE_MB:-20}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-ts-img}
      - RUSTFS_SECURE=${RUSTFS_SECURE:-false}
      - RUSTFS_PUBLIC_URL=${RUSTFS_PUBLIC_URL}
      - REDIS_QUEUE_ENABLED=${REDIS_QUEUE_ENABLED:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    mem_limit: ${WORKER_MEMORY_LIMIT:-32G}
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-40G}
    mem_reservation: ${WORKER_MEMORY_RESERVATION:-16G}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-32G}
        reservations:
          memory: ${WORKER_MEMORY_RESERVATION:-16G}
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tianshu-network
    depends_on:
      models-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_started

  # ============================================================================
  # Task Scheduler
  # ============================================================================
  scheduler:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-scheduler
    restart: unless-stopped
    command: ["scheduler", "python", "task_scheduler.py",
      "--litserve-url", "http://worker:8001/predict",
      "--monitor-interval", "60",
      "--stale-task-timeout", "30",
      "--cleanup-old-files-days", "${CLEANUP_OLD_FILES_DAYS:-7}",
      "--wait-for-workers"]
    volumes:
      - ./data/db:/app/data/db:rw
      - ./data/output:/app/data/output:rw
      - ./logs/scheduler:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db/mineru_tianshu.db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - tianshu-network
    depends_on:
      - worker
      - backend

  # ============================================================================
  # MCP Server
  # ============================================================================
  mcp-server:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-mcp
    restart: unless-stopped
    command: ["mcp", "python", "mcp_server.py"]
    ports:
      - "${MCP_PORT:-8002}:8002"
    volumes:
      - ./mcp_config.example.json:/app/backend/mcp_config.json:ro
      - ./logs/mcp:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - MCP_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_URL=${API_URL:-http://backend:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tianshu-network
    depends_on:
      - backend

  # ============================================================================
  # Frontend (Vue 3 + Nginx)
  # ============================================================================
  frontend:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-frontend:${FRONTEND_TAG:-latest}
    container_name: tianshu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - tianshu-network
    depends_on:
      - backend

networks:
  tianshu-network:
    driver: bridge
    name: tianshu-network
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  # 模型共享卷（由 models-init 填充）
  models-shared:
    driver: local
    name: tianshu-models-shared
  # 模型缓存卷
  backend-models-cache:
    driver: local
    name: tianshu-backend-models
  backend-paddleocr-cache:
    driver: local
    name: tianshu-backend-paddleocr
  worker-models-cache:
    driver: local
    name: tianshu-worker-models
  worker-paddleocr-cache:
    driver: local
    name: tianshu-worker-paddleocr
  redis-data:
    driver: local
    name: tianshu-redis-data
  rustfs-data:
    driver: local
    name: tianshu-rustfs-data
  rustfs-logs:
    driver: local
    name: tianshu-rustfs-logs
